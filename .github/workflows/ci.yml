name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime and lint dependencies
        run: python -m pip install -r requirements.txt flake8==7.4.1

      - name: Check syntax and undefined names
        run: python -m flake8 ios_xe_upgrade_manager.py launcher.py --select=E9,F63,F7,F82 --show-source

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run application smoke tests
        run: python tests/smoke_test.py

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt

  build:
    name: Windows executable build
    needs: [checks, dependency-audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies and builder
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build .exe
        shell: pwsh
        run: |
          $args = @("--noconsole","--onefile","--name","NetUpgrade",
                    "--hidden-import","ios_xe_upgrade_manager",
                    "--collect-all","netmiko","--collect-all","cryptography")
          if (Test-Path app.ico) { $args += @("--icon","app.ico","--add-data","app.ico;.") }
          python -m PyInstaller @args launcher.py

      - name: Confirm the .exe exists
        shell: pwsh
        run: if (-not (Test-Path dist/NetUpgrade.exe)) { throw "exe not built" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NetUpgrade
          path: dist/NetUpgrade.exe
          retention-days: 7
